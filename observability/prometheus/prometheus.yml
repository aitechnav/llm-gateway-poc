global:
  scrape_interval: 10s
  evaluation_interval: 10s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: sentinelguard
    metrics_path: /metrics
    static_configs:
      - targets:
          - sentinelguard:8080

  - job_name: chatbot
    metrics_path: /metrics
    static_configs:
      - targets:
          - chatbot:3000

  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090
