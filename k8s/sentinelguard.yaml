apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinelguard
  labels:
    app.kubernetes.io/name: sentinelguard
    app.kubernetes.io/component: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sentinelguard
  template:
    metadata:
      labels:
        app: sentinelguard
        app.kubernetes.io/name: sentinelguard
        app.kubernetes.io/component: gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: sentinelguard
          image: aitechnav/sentinelguard:0.0.10
          imagePullPolicy: IfNotPresent
          args:
            - gateway
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - --config
            - /etc/sentinelguard/sentinelguard.yaml
            - --gateway-config
            - /etc/sentinelguard/gateway.yaml
          envFrom:
            - secretRef:
                name: sentinelguard-secrets
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: sentinelguard-config
              mountPath: /etc/sentinelguard
              readOnly: true
          readinessProbe:
            httpGet:
              path: /gateway/v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /gateway/v1/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
      volumes:
        - name: sentinelguard-config
          configMap:
            name: sentinelguard-config
---
apiVersion: v1
kind: Service
metadata:
  name: sentinelguard
  labels:
    app.kubernetes.io/name: sentinelguard
    app.kubernetes.io/component: gateway
spec:
  selector:
    app: sentinelguard
  ports:
    - name: http
      port: 8080
      targetPort: http

